name: One-time all-family LHS catalog update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-lhs-all-families.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply all-family LHS selection patch
        run: python .github/one_time_lhs_all_families.py
      - name: Commit catalog selection update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use LHS selection for all observer families"
          git push
