name: Fix GA FE bookkeeping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ga-fe-bookkeeping.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch run_opt.m
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('run_opt.m')
          s = p.read_text()

          s = s.replace("history = table();\nactualEvals = NaN;", "history = table();\nactualEvals = NaN;\nsolverFunccount = NaN;")

          old = """            actualEvals = solverOutput.funccount;\n            history = get_fe_history();"""
          new = """            solverFunccount = solverOutput.funccount;\n            history = get_fe_history();\n            if isempty(history)\n                actualEvals = solverFunccount;\n            else\n                % Integer-constrained GA can perform one final bookkeeping\n                % objective call after the last population search step.\n                % Use the cumulative GA state count as the fair search budget.\n                actualEvals = history.fe(end);\n            end"""
          if old not in s:
              raise SystemExit('GA funccount block not found')
          s = s.replace(old, new, 1)

          old = """            actualEvals = solverOutput.funccount;\n            history = get_fe_history();"""
          new = """            actualEvals = solverOutput.funccount;\n            solverFunccount = actualEvals;\n            history = get_fe_history();"""
          if old not in s:
              raise SystemExit('PSO funccount block not found')
          s = s.replace(old, new, 1)

          old = """            actualEvals = results.NumObjectiveEvaluations;\n\n            history = table("""
          new = """            actualEvals = results.NumObjectiveEvaluations;\n            solverFunccount = actualEvals;\n\n            history = table("""
          if old not in s:
              raise SystemExit('BO funccount block not found')
          s = s.replace(old, new, 1)

          old = """            [x_best, min_cost, actualEvals, history] = ...\n                abc_discrete(ObjFcn, LB, UB, abc_opts);"""
          new = """            [x_best, min_cost, actualEvals, history] = ...\n                abc_discrete(ObjFcn, LB, UB, abc_opts);\n            solverFunccount = actualEvals;"""
          if old not in s:
              raise SystemExit('ABC block not found')
          s = s.replace(old, new, 1)

          old = """            [x_best, min_cost, actualEvals, history] = ...\n                aco_discrete(ObjFcn, LB, UB, aco_opts);"""
          new = """            [x_best, min_cost, actualEvals, history] = ...\n                aco_discrete(ObjFcn, LB, UB, aco_opts);\n            solverFunccount = actualEvals;"""
          if old not in s:
              raise SystemExit('ACO block not found')
          s = s.replace(old, new, 1)

          old = """    runState.nEvaluations = actualEvals;\n    runState.bestX = x_best;"""
          new = """    runState.nEvaluations = actualEvals;\n    runState.solverFunctionEvaluations = solverFunccount;\n    runState.nonSearchFunctionEvaluations = max(0, solverFunccount - actualEvals);\n    runState.bestX = x_best;"""
          if old not in s:
              raise SystemExit('runState eval block not found')
          s = s.replace(old, new, 1)

          old = """    safe_printf('FE = %d/%d | bestJ = %.12g | %s\\n', ...\n        actualEvals, FE_BUDGET, min_cost, termination);"""
          new = """    safe_printf('Search FE = %d/%d | solver calls = %d | bestJ = %.12g | %s\\n', ...\n        actualEvals, FE_BUDGET, solverFunccount, min_cost, termination);"""
          if old not in s:
              raise SystemExit('FE print block not found')
          s = s.replace(old, new, 1)

          old = """        summaryRow.actual_evals = actualEvals;\n        summaryRow.termination = termination;"""
          new = """        summaryRow.actual_evals = actualEvals;\n        summaryRow.solver_funccount = solverFunccount;\n        summaryRow.nonsearch_evals = max(0, solverFunccount - actualEvals);\n        summaryRow.termination = termination;"""
          if old not in s:
              raise SystemExit('summary eval block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add run_opt.m
          git commit -m "Distinguish GA search FE from final bookkeeping call"
          git push origin main
