name: Fix LaTeX escape warning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-latex-escape.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch LaTeX separator
        run: python .github/fix_latex_escape.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix MATLAB LaTeX escape warning"
          git push
