name: Route manuscript exports
on:
  push:
    branches: [main]
    paths: [.github/workflows/route-manuscript-exports.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Route remaining EPS writers through shared finalizer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=[]
          for p in Path('.').rglob('*.m'):
              if p.name == 'finalize_manuscript_figure.m':
                  continue
              lines=p.read_text(encoding='utf-8').splitlines(True)
              out=[]; dirty=False
              for line in lines:
                  if "print(" in line and "'-depsc2'" in line and "'-loose'" in line and 'finalize_manuscript_figure(' not in line:
                      m=re.search(r"print\(([^,]+),",line)
                      if m:
                          fig=m.group(1).strip()
                          line=line.replace('print(',f'finalize_manuscript_figure({fig}); print(',1)
                          dirty=True
                  out.append(line)
              if dirty:
                  p.write_text(''.join(out),encoding='utf-8'); changed.append(str(p))
          print('\n'.join(changed) if changed else 'No remaining inline writers.')
          PY
          git diff --check
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route remaining manuscript exports through shared finalizer"
          git push origin HEAD:main
