name: One-time visibility measurement polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Repair patcher replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_patch_visibility_measurement_figures.py')
          s = p.read_text()
          s = s.replace(
              "pattern_visibility.subn(visibility + '\\n\\n', text, count=1)",
              "pattern_visibility.subn(lambda m: visibility + '\\n\\n', text, count=1)")
          s = s.replace(
              "pattern_measurement.subn(measurement + '\\n\\n', text, count=1)",
              "pattern_measurement.subn(lambda m: measurement + '\\n\\n', text, count=1)")
          p.write_text(s)
          PY
      - name: Patch visibility and measurement figures
        run: python scripts/_patch_visibility_measurement_figures.py
      - name: Commit figure polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish visibility and measurement schematics"
          git push origin main
