name: One-time slot geometry cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-slot-lagrange-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch slot geometry figure
        run: python .github/one_time_slot_lagrange_cleanup.py
      - name: Commit slot geometry update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Simplify slot geometry reference point"
          git push
