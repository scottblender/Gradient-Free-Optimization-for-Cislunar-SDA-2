name: One-time fixed target cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fixed-target-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refactor fixed target cases
        run: python .github/one_time_fixed_target_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Decouple fixed target cases from observer catalog"
          git push
