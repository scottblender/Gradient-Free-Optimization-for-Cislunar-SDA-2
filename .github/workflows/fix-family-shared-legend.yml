name: Fix family shared legend

on:
  push:
    paths:
      - .github/workflows/fix-family-shared-legend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch family shared legend handling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f"Expected one match in {path}, found {n}: {old[:160]!r}")
              p.write_text(text.replace(old, new, 1))

          # General shared-legend helper: support line/marker keys so the
          # orbit-family legend can preserve Moon/L1/L2 marker semantics.
          p = 'scripts/export_shared_result_legend.m'
          replace_once(
              p,
              "addParameter(p,'LineStyles',strings(0,1),@(x) ischar(x) || isstring(x) || iscellstr(x));\naddParameter(p,'NumColumns',[],@(x) isempty(x) || (isscalar(x) && x >= 1));\n",
              "addParameter(p,'LineStyles',strings(0,1),@(x) ischar(x) || isstring(x) || iscellstr(x));\naddParameter(p,'Markers',strings(0,1),@(x) ischar(x) || isstring(x) || iscellstr(x));\naddParameter(p,'NumColumns',[],@(x) isempty(x) || (isscalar(x) && x >= 1));\n",
          )
          replace_once(
              p,
              "assert(numel(lineStyles) == numel(labels), ...\n    'LineStyles must contain one entry per legend label.');\n\nnCols = p.Results.NumColumns;\n",
              "assert(numel(lineStyles) == numel(labels), ...\n    'LineStyles must contain one entry per legend label.');\n\nmarkers = string(p.Results.Markers(:));\nif isempty(markers)\n    markers = repmat(\"none\",numel(labels),1);\nend\nassert(numel(markers) == numel(labels), ...\n    'Markers must contain one entry per legend label.');\n\nnCols = p.Results.NumColumns;\n",
          )
          replace_once(
              p,
              "    else\n        handles(k) = plot(ax,nan,nan,'LineStyle',lineStyles(k), ...\n            'Color',colors(k,:),'LineWidth',style.lineWidth, ...\n            'DisplayName',labels(k));\n    end\n",
              "    else\n        handles(k) = plot(ax,nan,nan,'LineStyle',lineStyles(k), ...\n            'Marker',markers(k),'Color',colors(k,:), ...\n            'LineWidth',style.lineWidth,'MarkerSize',9, ...\n            'MarkerFaceColor',colors(k,:),'MarkerEdgeColor',colors(k,:), ...\n            'DisplayName',labels(k));\n    end\n",
          )

          # Study-definition orbit families: the four paired halo/NRHO panels
          # share one external legend EPS; only the standalone DRO keeps its
          # unique in-panel legend.
          p = 'scripts/plot_study_definition_figures.m'
          replace_once(
              p,
              "cPoint = [0.85,0.85,0.85];\n\nnumPairOrbitsPerFamily = 16;\n",
              "cPoint = [0.85,0.85,0.85];\n\nstyle = reviewer2_paper_style();\nsharedFamilyLegendFiles = export_shared_result_legend( ...\n    outputDir,\"orbit_family_trajectory_legend\", ...\n    [\"L1\";\"L2\";\"Moon\";\"L1 point\";\"L2 point\"], ...\n    [cL1;cL2;cMoon;cPoint;cPoint],style, ...\n    'LineStyles',[\"-\";\"-\";\"none\";\"none\";\"none\"], ...\n    'Markers',[\"none\";\"none\";\"o\";\"^\";\"v\"], ...\n    'NumColumns',3);\n\nnumPairOrbitsPerFamily = 16;\n",
          )
          replace_once(
              p,
              "    if numel(group)==2\n        legendHandle = legend(ax,legendHandles,cellstr(legendLabels), ...\n            'Location','northoutside','Orientation','horizontal');\n        legendColumns = numel(legendLabels);\n    else\n        legendHandle = legend(ax,legendHandles,cellstr(legendLabels), ...\n            'Location','northeast','Orientation','vertical');\n        legendColumns = 1;\n    end\n    format_study_legend(legendHandle,legendColumns,[14 8]);\n\n    if numel(group)==2\n        finalize_centered_3d_axes(ax,legendHandle,plotPosition);\n    else\n",
              "    if numel(group)==2\n        % The paired halo/NRHO panels use the shared legend-only EPS above\n        % the LaTeX subfigure grid, so no legend is embedded in these panels.\n        legendHandle = gobjects(0);\n    else\n        legendHandle = legend(ax,legendHandles,cellstr(legendLabels), ...\n            'Location','northeast','Orientation','vertical');\n        format_study_legend(legendHandle,1,[14 8]);\n    end\n\n    if numel(group)==2\n        finalize_centered_3d_axes(ax,legendHandle,style.geometryGridPlotPosition);\n    else\n",
          )
          replace_once(
              p,
              "outputs = struct();\noutputs.figures = figureFiles;\noutputs.familySummary = string(summaryFile);\n",
              "outputs = struct();\noutputs.figures = figureFiles;\noutputs.sharedLegend = sharedFamilyLegendFiles(1);\noutputs.familySummary = string(summaryFile);\n",
          )
          replace_once(
              p,
              "format_manuscript_legend(ax,legendHandle,style,plotPosition);\n\nend\n",
              "if isempty(legendHandle) || ~isgraphics(legendHandle)\n    ax.Units = 'normalized';\n    ax.PositionConstraint = 'innerposition';\n    ax.Position = plotPosition;\n    format_manuscript_ticks(ax);\n    center_manuscript_content(ancestor(ax,'figure'),ax,[]);\nelse\n    format_manuscript_legend(ax,legendHandle,style,plotPosition);\nend\n\nend\n",
          )
          PY
      - name: Static checks
        run: |
          git diff --check
          grep -q "orbit_family_trajectory_legend" scripts/plot_study_definition_figures.m
          grep -q "sharedFamilyLegendFiles" scripts/plot_study_definition_figures.m
          grep -q "legendHandle = gobjects(0)" scripts/plot_study_definition_figures.m
          grep -q "addParameter(p,'Markers'" scripts/export_shared_result_legend.m
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/plot_study_definition_figures.m scripts/export_shared_result_legend.m
          git commit -m "Separate orbit-family shared legend"
          git push origin main
