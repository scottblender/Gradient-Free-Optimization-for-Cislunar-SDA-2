name: Include GI in default Monte Carlo study
on:
  push:
    branches: [main]
    paths: [.github/workflows/include-gi-mc-default.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Monte Carlo defaults
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path('scripts/run_reviewer2_baseline_monte_carlo.m')
          text = runner.read_text(encoding='utf-8')

          old_block = '''% The no-argument default reproduces both baseline AO validation sets used
          % in the paper:
          %   * LOW_THRUST_TRANSFER: 3/5/7/10 observers, one trajectory each;
          %   * LUNAR_GATEWAY:       3/5/7/10 observers x 1/3/5 periods.
          % This gives 16 cases total (4000 objective evaluations at 250 samples/case).
          % GATEWAY_IMPULSE remains available as an optional mission but is not part
          % of the default Monte Carlo validation set.'''.replace('          %','%')
          new_block = '''% The no-argument default reproduces all three baseline AO validation sets:
          %   * LOW_THRUST_TRANSFER: 3/5/7/10 observers, one trajectory each;
          %   * LUNAR_GATEWAY:       3/5/7/10 observers x 1/3/5 periods;
          %   * GATEWAY_IMPULSE:     3/5/7/10 observers, one trajectory each.
          % This gives 20 cases total (5000 objective evaluations at 250 samples/case).'''.replace('          %','%')
          if old_block not in text:
              raise SystemExit('Missing default-study documentation block.')
          text = text.replace(old_block,new_block,1)

          old_docs = '''%   Mission            string/string vector; default is
          %                      [LOW_THRUST_TRANSFER, LUNAR_GATEWAY].
          %                      GATEWAY_IMPULSE is also supported.'''.replace('          %','%')
          new_docs = '''%   Mission            string/string vector; default is
          %                      [LOW_THRUST_TRANSFER, LUNAR_GATEWAY,
          %                       GATEWAY_IMPULSE].'''.replace('          %','%')
          if old_docs not in text:
              raise SystemExit('Missing Mission option documentation.')
          text = text.replace(old_docs,new_docs,1)

          old_vec = '["LOW_THRUST_TRANSFER","LUNAR_GATEWAY"]'
          new_vec = '["LOW_THRUST_TRANSFER","LUNAR_GATEWAY","GATEWAY_IMPULSE"]'
          if text.count(old_vec) < 2:
              raise SystemExit('Expected both example and default mission vectors.')
          text = text.replace(old_vec,new_vec)
          runner.write_text(text,encoding='utf-8')

          test = Path('tests/test_baseline_monte_carlo_configuration.m')
          text = test.read_text(encoding='utf-8')
          old_test = r'\["LOW_THRUST_TRANSFER","LUNAR_GATEWAY"\]'
          new_test = r'\["LOW_THRUST_TRANSFER","LUNAR_GATEWAY","GATEWAY_IMPULSE"\]'
          if old_test not in text:
              raise SystemExit('Missing expected test mission vector.')
          text = text.replace(old_test,new_test,1)
          test.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_reviewer2_baseline_monte_carlo.m tests/test_baseline_monte_carlo_configuration.m
          git commit -m "Include GI in default Monte Carlo study"
          git push origin HEAD:main
