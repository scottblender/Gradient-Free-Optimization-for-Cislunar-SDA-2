name: Final orbit family fix
on:
  push:
    paths:
      - .github/workflows/final-orbit-family-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_orbit_family_labels_final.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/make_reviewer2_curated_figures.m tests/test_reviewer2_paper_figures_configuration.m
          git commit -m "Fix orbit-family labels and spacing"
          git push origin main
