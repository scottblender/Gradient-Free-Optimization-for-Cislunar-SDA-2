name: Restore LT endpoint orbit context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-lt-endpoint-orbits.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore plot-only endpoint orbits
        run: python .github/restore_lt_endpoint_orbits.py
      - name: Commit restored plot context
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore LT endpoint orbits in study plot"
          git push
