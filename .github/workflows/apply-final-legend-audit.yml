name: Apply final manuscript legend audit

on:
  push:
    paths:
      - .github/workflows/apply-final-legend-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply plotting changes
        run: python .github/scripts/apply_final_legend_audit.py
      - name: Commit plotting updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reviewer2_paper_style.m \
                  scripts/make_reviewer2_curated_figures.m \
                  scripts/plot_reviewer2_geometry_grid.m \
                  scripts/plot_reviewer2_baseline_monte_carlo.m \
                  run_manuscript_figures.m \
                  tests/test_reviewer2_paper_figures_configuration.m
          git commit -m "Improve manuscript legend readability and family spacing"
          git push origin main
