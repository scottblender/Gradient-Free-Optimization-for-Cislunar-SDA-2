name: One-time LHS MATLAB format repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-lhs-format-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair MATLAB format strings
        run: python .github/one_time_lhs_format_repair.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair all-family LHS MATLAB format strings"
          git push
