name: Apply comparison baseline and slot marker updates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-comparison-baseline-slot-markers.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply plotting updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit('Missing expected text for ' + label)
              return text.replace(old, new, 1)

          path = Path('scripts/make_reviewer2_curated_figures.m')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              '    refs = matched_baselines(baselineResults,missions,3,1);',
              "    refs = matched_baselines(baselineResults,missions,3,1,'BestJMean','BestJStd');",
              'objective baseline')
          old = ("    for q = 1:size(specs,1)\n"
                 "        plot_comparison_metric(r,specs{q,1},specs{q,2},specs{q,3}, ...\n"
                 "            string(specs{q,4}),out,saveFigures,style,table());\n"
                 "        manifest = add_manifest(manifest,\"comparison\",string(specs{q,4}), ...\n"
                 "            \"Case-wise optimizer metric, mean +/- sample std.\");\n"
                 "    end")
          new = ("    for q = 1:size(specs,1)\n"
                 "        metricRefs = matched_baselines(baselineResults,missions,3,1, ...\n"
                 "            specs{q,1},specs{q,2});\n"
                 "        plot_comparison_metric(r,specs{q,1},specs{q,2},specs{q,3}, ...\n"
                 "            string(specs{q,4}),out,saveFigures,style,metricRefs);\n"
                 "        manifest = add_manifest(manifest,\"comparison\",string(specs{q,4}), ...\n"
                 "            \"Case-wise optimizer metric, mean +/- sample std., with matched GA baseline.\");\n"
                 "    end")
          text = replace_once(text, old, new, 'metric baselines')
          text = replace_once(text,
              'function ref = matched_baseline(B,mission,numObservers,nPeriods)\nref = table();',
              "function ref = matched_baseline(B,mission,numObservers,nPeriods,valueField,stdField)\nif nargin < 6, stdField = 'BestJStd'; end\nif nargin < 5, valueField = 'BestJMean'; end\nref = table();",
              'matched_baseline signature')
          text = replace_once(text,
              'ref = table(string(mission),rows.BestJMean,rows.BestJStd, ...',
              'ref = table(string(mission),rows.(valueField),rows.(stdField), ...',
              'matched baseline fields')
          old = ("function refs = matched_baselines(B,missions,numObservers,nPeriods)\n"
                 "refs = table();\n"
                 "for mission = string(missions(:)')\n"
                 "    row = matched_baseline(B,mission,numObservers,nPeriods);")
          new = ("function refs = matched_baselines(B,missions,numObservers,nPeriods,valueField,stdField)\n"
                 "if nargin < 6, stdField = 'BestJStd'; end\n"
                 "if nargin < 5, valueField = 'BestJMean'; end\n"
                 "refs = table();\n"
                 "for mission = string(missions(:)')\n"
                 "    row = matched_baseline(B,mission,numObservers,nPeriods,valueField,stdField);")
          text = replace_once(text, old, new, 'matched_baselines signature')
          text = text.replace("'6000-FE GA reference'", "'GA baseline'")
          text = text.replace('"6000-FE GA reference"', '"GA baseline"')
          text = text.replace('matched 6000-FE GA reference.', 'matched GA baseline.')
          text = text.replace('matched 6000-FE GA references.', 'matched GA baselines.')
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/plot_study_definition_figures.m')
          text = path.read_text(encoding='utf-8')
          old = ("hSelected = plot3(ax,slotState(selectedSlot,1), ...\n"
                 "    slotState(selectedSlot,2),slotState(selectedSlot,3), ...\n"
                 "    'o','MarkerSize',9,'MarkerFaceColor',selectedColor, ...\n"
                 "    'MarkerEdgeColor','k','LineWidth',1.2);\n"
                 "hNext = plot3(ax,slotState(nextSlot,1), ...\n"
                 "    slotState(nextSlot,2),slotState(nextSlot,3), ...\n"
                 "    's','MarkerSize',9,'MarkerFaceColor',nextColor, ...\n"
                 "    'MarkerEdgeColor','k','LineWidth',1.2);")
          new = ("hSelected = plot3(ax,slotState(selectedSlot,1), ...\n"
                 "    slotState(selectedSlot,2),slotState(selectedSlot,3), ...\n"
                 "    'o','MarkerSize',13,'MarkerFaceColor','w', ...\n"
                 "    'MarkerEdgeColor',selectedColor,'LineWidth',2.8);\n"
                 "plot3(ax,slotState(selectedSlot,1),slotState(selectedSlot,2), ...\n"
                 "    slotState(selectedSlot,3),'+','MarkerSize',9,'Color','k', ...\n"
                 "    'LineWidth',1.8,'HandleVisibility','off');\n"
                 "hNext = plot3(ax,slotState(nextSlot,1), ...\n"
                 "    slotState(nextSlot,2),slotState(nextSlot,3), ...\n"
                 "    's','MarkerSize',13,'MarkerFaceColor','w', ...\n"
                 "    'MarkerEdgeColor',nextColor,'LineWidth',2.8);\n"
                 "plot3(ax,slotState(nextSlot,1),slotState(nextSlot,2), ...\n"
                 "    slotState(nextSlot,3),'x','MarkerSize',9,'Color','k', ...\n"
                 "    'LineWidth',1.8,'HandleVisibility','off');")
          text = replace_once(text, old, new, 'equal-time slot markers')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_reviewer2_paper_figures_configuration.m')
          text = path.read_text(encoding='utf-8')
          anchor = ("assert(contains(parallelText,'style.figureWidth style.figureHeight') && ...\n"
                    "    contains(parallelText,'format_manuscript_legend'), ...\n"
                    "    'Parallel figures must use the common canvas and legend formatter.');\n")
          addition = (anchor + "\n"
              "% Every optimizer-comparison metric uses its matched GA baseline reference.\n"
              "assert(contains(curatedText,'metricRefs = matched_baselines(baselineResults,missions,3,1, ...') && ...\n"
              "    contains(curatedText,'style,metricRefs)') && ...\n"
              "    count(curatedText,'GA baseline') >= 2, ...\n"
              "    'Comparison metrics must include the matched GA baseline with consistent labeling.');\n\n"
              "% Selected equal-time slots must remain visible in vector EPS exports without\n"
              "% relying on filled marker faces.\n"
              "assert(count(studyText,\"'MarkerSize',13,'MarkerFaceColor','w'\") >= 2 && ...\n"
              "    contains(studyText,\"'MarkerEdgeColor',selectedColor,'LineWidth',2.8\") && ...\n"
              "    contains(studyText,\"'MarkerEdgeColor',nextColor,'LineWidth',2.8\"), ...\n"
              "    'Equal-time Slot j / Slot j+1 markers must use large EPS-safe outlines.');\n")
          text = replace_once(text, anchor, addition, 'configuration assertions')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit plotting updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-comparison-baseline-slot-markers.yml
          git add scripts/make_reviewer2_curated_figures.m scripts/plot_study_definition_figures.m tests/test_reviewer2_paper_figures_configuration.m
          git commit -m "Add GA baselines and clarify slot markers"
          git push origin HEAD:main
