name: One-time schematic readability v5

on:
  push:
    paths:
      - 'scripts/_patch_schematic_readability_v5.py'
      - '.github/workflows/one-time-schematic-readability-v5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch schematic readability
        run: python scripts/_patch_schematic_readability_v5.py
      - name: Commit readability changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/_patch_schematic_readability_v5.py
          rm .github/workflows/one-time-schematic-readability-v5.yml
          git add scripts/plot_study_definition_figures.m scripts/_patch_schematic_readability_v5.py .github/workflows/one-time-schematic-readability-v5.yml
          git commit -m "Improve visibility and measurement readability"
          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
