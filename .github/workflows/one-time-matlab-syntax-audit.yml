name: One-time MATLAB syntax audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-matlab-syntax-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and audit MATLAB sources
        run: python .github/one_time_matlab_syntax_audit.py
      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Repair fixed target cleanup syntax"
          git push
