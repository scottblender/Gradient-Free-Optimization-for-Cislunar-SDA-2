name: Apply final figure audit v2

on:
  push:
    paths:
      - .github/workflows/apply-final-figure-audit-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply MATLAB figure fixes
        run: python .github/scripts/apply_final_figure_audit_v2.py
      - name: Static checks
        run: |
          git diff --check
          grep -q 'style.sharedGeometryLegendWidth = 3.10' scripts/reviewer2_paper_style.m
          grep -q 'caseLabels = \["LG","LT","GI"\]' scripts/make_reviewer2_curated_figures.m
          grep -q 'ax.XTickLabelRotation = style.categoryLabelAngle' scripts/make_reviewer2_curated_figures.m
      - name: Commit plotting updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reviewer2_paper_style.m \
                  scripts/plot_reviewer2_geometry_grid.m \
                  scripts/make_reviewer2_curated_figures.m \
                  tests/test_reviewer2_paper_figures_configuration.m
          git commit -m "Finalize trajectory legends and orbit-family labels"
          git push origin main
