name: One-time study geometry update

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch study figures
        run: python .github/patch_study_geometry.py
      - name: Commit study figure update
        run: |
          rm .github/patch_study_geometry.py
          rm .github/workflows/one-time-study-geometry-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add visibility and measurement schematics"
          git push origin main
