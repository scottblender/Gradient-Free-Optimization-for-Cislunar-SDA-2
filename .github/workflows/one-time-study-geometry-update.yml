name: One-time study geometry update

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch study-definition figures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/plot_study_definition_figures.m')
          text = path.read_text()

          old_top = r'''function outputs = plot_study_definition_figures(inspectFigures)
          % Generate catalog, slot-definition, and target-case figures.

          if nargin<1 || isempty(inspectFigures), inspectFigures = true; end

          projectDir = fileparts(fileparts(mfilename('fullpath')));
          addpath(projectDir);
          setup_project();

          fprintf('\n--- Study-definition figures ---\n');

          fprintf('\n1/3 Orbit-family catalog figures\n');
          outputs.catalog = create_orbit_catalog_figures(inspectFigures);

          fprintf('\n2/3 Equal-time slot definition\n');
          outputs.slots = create_slot_definition(inspectFigures);

          fprintf('\n3/3 Tracking cases\n');
          fprintf('The low-thrust panel solves the transfer and can take several minutes.\n');
          outputs.cases = create_tracking_cases(inspectFigures);

          fprintf('\nAll study-definition figures were generated.\n');
          end'''.replace('          ', '')

          new_top = r'''function outputs = plot_study_definition_figures(inspectFigures)
          % Generate catalog, slot-definition, geometry, and target-case figures.

          if nargin<1 || isempty(inspectFigures), inspectFigures = true; end

          projectDir = fileparts(fileparts(mfilename('fullpath')));
          addpath(projectDir);
          setup_project();

          fprintf('\n--- Study-definition figures ---\n');

          fprintf('\n1/5 Orbit-family catalog figures\n');
          outputs.catalog = create_orbit_catalog_figures(inspectFigures);

          fprintf('\n2/5 Equal-time slot definition\n');
          outputs.slots = create_slot_definition(inspectFigures);

          fprintf('\n3/5 Unified visibility / keepout geometry\n');
          outputs.visibilityGeometry = create_visibility_keepout_figure(inspectFigures);

          fprintf('\n4/5 RA/Dec measurement geometry\n');
          outputs.measurementGeometry = create_measurement_model_figure(inspectFigures);

          fprintf('\n5/5 Tracking cases\n');
          fprintf('The low-thrust panel solves the transfer and can take several minutes.\n');
          outputs.cases = create_tracking_cases(inspectFigures);

          fprintf('\nAll study-definition figures were generated.\n');
          end'''.replace('          ', '')

          if old_top not in text:
              raise SystemExit('Top-level plotting driver block was not found.')
          text = text.replace(old_top, new_top, 1)

          text = text.replace(
              'numPairOrbitsPerFamily = 10;\nnumDroOrbits = 10;',
              'numPairOrbitsPerFamily = 16;\nnumDroOrbits = 16;',
              1)

          old_pair = r'''            assert(numel(familyRows)==50, ...
              'Expected 50 selected orbits for %s, found %d.', ...
              group(member),numel(familyRows));
            plotStride = numel(familyRows)/perFamily;
            assert(plotStride==round(plotStride), ...
              'Orbit plotting stride must be an integer.');
            selectedRows = familyRows(plotStride:plotStride:end);'''

          new_pair = r'''            assert(numel(familyRows)==50, ...
              'Expected 50 selected orbits for %s, found %d.', ...
              group(member),numel(familyRows));
            selectedIndex = unique(round(linspace( ...
              1,numel(familyRows),min(perFamily,numel(familyRows)))));
            selectedRows = familyRows(selectedIndex);'''

          if old_pair not in text:
              raise SystemExit('Paired-family plotting selection block was not found.')
          text = text.replace(old_pair, new_pair, 1)

          old_dro = r'''        assert(numel(familyRows)==50, ...
            'Expected 50 selected DROs, found %d.',numel(familyRows));
        plotStride = numel(familyRows)/numDroOrbits;
        assert(plotStride==round(plotStride), ...
            'DRO plotting stride must be an integer.');
        selectedRows = plotStride:plotStride:numel(familyRows);'''

          new_dro = r'''        assert(numel(familyRows)==50, ...
            'Expected 50 selected DROs, found %d.',numel(familyRows));
        selectedRows = unique(round(linspace( ...
            1,numel(familyRows),min(numDroOrbits,numel(familyRows)))));'''

          if old_dro not in text:
              raise SystemExit('DRO plotting selection block was not found.')
          text = text.replace(old_dro, new_dro, 1)

          insert_marker = 'function outputs = create_tracking_cases(inspectFigure)'
          if insert_marker not in text:
              raise SystemExit('Tracking-case insertion marker was not found.')
          if 'function outputs = create_visibility_keepout_figure' in text:
              raise SystemExit('Visibility geometry function already exists.')

          new_functions = r'''
          function outputs = create_visibility_keepout_figure(inspectFigure)
          % Illustrate the unified Earth/Moon/Sun visibility test used by
          % calc_visibility. The effective keepout angle is the larger of
          % the finite-range occultation threshold and the configured
          % sensor/body separation threshold.

          if nargin<1 || isempty(inspectFigure), inspectFigure = true; end

          projectDir = fileparts(fileparts(mfilename('fullpath')));
          addpath(projectDir);
          projectPaths = setup_project();

          outputDir = fullfile(projectPaths.results,'study_definition_figures');
          if ~isfolder(outputDir), mkdir(outputDir); end

          fig = publication_figure(7.2,3.9);
          layout = tiledlayout(fig,1,2,'TileSpacing','compact','Padding','compact');

          cObserver = [0.90,0.12,0.10];
          cTarget = [0.00,0.39,0.72];
          cBody = [0.68,0.68,0.68];
          cOcc = [0.38,0.38,0.38];
          cSensor = [0.92,0.55,0.05];
          cKeepout = [0.72,0.13,0.12];
          cAccept = [0.10,0.48,0.20];

          % ---- (a) Finite-range physical occultation ----
          ax = nexttile(layout,1);
          hold(ax,'on');
          axis(ax,'equal');
          axis(ax,'off');

          observer = [-2.25,0.0];
          body = [0.0,0.0];
          bodyRadius = 0.62;
          bodyDistance = norm(body-observer);
          thetaOcc = asin(bodyRadius/bodyDistance);
          losAngle = 0.13;
          targetRange = 4.55;
          target = observer + targetRange*[cos(losAngle),sin(losAngle)];
          tangentEnd = observer + 4.65*[cos(thetaOcc),sin(thetaOcc)];

          wedgeAngle = linspace(0,thetaOcc,80);
          wedgeRadius = 1.30;
          wedgeX = [observer(1), ...
              observer(1)+wedgeRadius*cos(wedgeAngle),observer(1)];
          wedgeY = [observer(2), ...
              observer(2)+wedgeRadius*sin(wedgeAngle),observer(2)];
          patch(ax,wedgeX,wedgeY,[0.94,0.94,0.94], ...
              'EdgeColor','none','HandleVisibility','off');

          bodyAngle = linspace(0,2*pi,200);
          fill(ax,body(1)+bodyRadius*cos(bodyAngle), ...
              body(2)+bodyRadius*sin(bodyAngle),cBody, ...
              'EdgeColor','k','LineWidth',1.0);

          plot(ax,[observer(1),body(1)],[observer(2),body(2)],'--', ...
              'Color',cOcc,'LineWidth',1.1);
          plot(ax,[observer(1),tangentEnd(1)],[observer(2),tangentEnd(2)],'--', ...
              'Color',cKeepout,'LineWidth',1.3);
          plot(ax,[observer(1),target(1)],[observer(2),target(2)],'-k', ...
              'LineWidth',1.8);

          plot(ax,observer(1),observer(2),'o','MarkerSize',8, ...
              'MarkerFaceColor',cObserver,'MarkerEdgeColor','k');
          plot(ax,target(1),target(2),'o','MarkerSize',8, ...
              'MarkerFaceColor',cTarget,'MarkerEdgeColor','k');

          draw_angle_arc_2d(ax,observer,0,thetaOcc,0.82,cKeepout,1.3);
          draw_angle_arc_2d(ax,observer,0,losAngle,0.55,[0,0,0],1.2);

          text(ax,observer(1)-0.32,observer(2)+0.28,'Observer', ...
              'Color',cObserver,'FontWeight','bold','FontSize',11, ...
              'HorizontalAlignment','center');
          text(ax,target(1)+0.05,target(2)+0.25,'Target', ...
              'Color',cTarget,'FontWeight','bold','FontSize',11, ...
              'HorizontalAlignment','center');
          text(ax,body(1),body(2)-0.10,'Body', ...
              'FontWeight','bold','FontSize',11,'HorizontalAlignment','center');
          text(ax,observer(1)+0.73*cos(thetaOcc/2), ...
              observer(2)+0.73*sin(thetaOcc/2)+0.08, ...
              '\\theta_{occ,b}','Color',cKeepout, ...
              'FontWeight','bold','FontSize',11);
          text(ax,observer(1)+0.44*cos(losAngle/2), ...
              observer(2)+0.44*sin(losAngle/2)-0.18, ...
              '\\theta_b','Color',[0,0,0], ...
              'FontWeight','bold','FontSize',11);
          text(ax,-0.10,0.82,'R_b','FontWeight','bold','FontSize',10);
          plot(ax,[body(1),body(1)],[body(2),body(2)+bodyRadius],':k', ...
              'LineWidth',1.0);

          text(ax,-2.48,-1.06, ...
              {'Finite target range defines \\theta_{occ,b}', ...
               'Tangency is treated as blocked'}, ...
              'FontSize',9.5,'FontWeight','bold');
          text(ax,-2.48,-1.52,'Blocked example: \\theta_b \\leq \\theta_{occ,b}', ...
              'Color',cKeepout,'FontSize',10,'FontWeight','bold');

          title(ax,'(a) Physical occultation','FontSize',12,'FontWeight','bold');
          xlim(ax,[-2.8,2.8]);
          ylim(ax,[-1.75,1.45]);

          % ---- (b) Unified keepout threshold ----
          ax = nexttile(layout,2);
          hold(ax,'on');
          axis(ax,'equal');
          axis(ax,'off');

          observer = [-2.10,0.0];
          body = [0.20,0.0];
          bodyRadius = 0.48;
          thetaOcc = deg2rad(14);
          thetaSensor = deg2rad(25);
          thetaKeepout = max(thetaOcc,thetaSensor);
          thetaBody = deg2rad(43);
          target = observer + 4.20*[cos(thetaBody),sin(thetaBody)];

          keepoutAngle = linspace(-thetaKeepout,thetaKeepout,120);
          keepoutRadius = 2.05;
          wedgeX = [observer(1), ...
              observer(1)+keepoutRadius*cos(keepoutAngle),observer(1)];
          wedgeY = [observer(2), ...
              observer(2)+keepoutRadius*sin(keepoutAngle),observer(2)];
          patch(ax,wedgeX,wedgeY,[1.00,0.94,0.86], ...
              'EdgeColor','none','HandleVisibility','off');

          bodyAngle = linspace(0,2*pi,200);
          fill(ax,body(1)+bodyRadius*cos(bodyAngle), ...
              body(2)+bodyRadius*sin(bodyAngle),cBody, ...
              'EdgeColor','k','LineWidth',1.0);

          plot(ax,[observer(1),body(1)],[observer(2),body(2)],'--', ...
              'Color',cOcc,'LineWidth',1.1);
          occEnd = observer + 3.25*[cos(thetaOcc),sin(thetaOcc)];
          sensorEnd = observer + 3.25*[cos(thetaSensor),sin(thetaSensor)];
          plot(ax,[observer(1),occEnd(1)],[observer(2),occEnd(2)],':', ...
              'Color',cOcc,'LineWidth',1.4);
          plot(ax,[observer(1),sensorEnd(1)],[observer(2),sensorEnd(2)],'--', ...
              'Color',cSensor,'LineWidth',1.5);
          plot(ax,[observer(1),target(1)],[observer(2),target(2)],'-', ...
              'Color',cAccept,'LineWidth',1.9);

          plot(ax,observer(1),observer(2),'o','MarkerSize',8, ...
              'MarkerFaceColor',cObserver,'MarkerEdgeColor','k');
          plot(ax,target(1),target(2),'o','MarkerSize',8, ...
              'MarkerFaceColor',cTarget,'MarkerEdgeColor','k');

          draw_angle_arc_2d(ax,observer,0,thetaOcc,0.62,cOcc,1.2);
          draw_angle_arc_2d(ax,observer,thetaOcc,thetaSensor,0.82,cSensor,1.3);
          draw_angle_arc_2d(ax,observer,0,thetaBody,1.17,cAccept,1.4);

          text(ax,observer(1)-0.28,observer(2)-0.28,'Observer', ...
              'Color',cObserver,'FontWeight','bold','FontSize',11, ...
              'HorizontalAlignment','center');
          text(ax,target(1)+0.02,target(2)+0.24,'Target', ...
              'Color',cTarget,'FontWeight','bold','FontSize',11, ...
              'HorizontalAlignment','center');
          text(ax,body(1),body(2)-0.12,'Body b', ...
              'FontWeight','bold','FontSize',10,'HorizontalAlignment','center');
          text(ax,0.05,-0.75,'b \\in {Earth, Moon, Sun}', ...
              'FontWeight','bold','FontSize',9.5,'HorizontalAlignment','center');

          text(ax,observer(1)+0.52*cos(thetaOcc/2), ...
              observer(2)+0.52*sin(thetaOcc/2)-0.12, ...
              '\\theta_{occ,b}','Color',cOcc,'FontWeight','bold','FontSize',10);
          text(ax,observer(1)+0.88*cos((thetaOcc+thetaSensor)/2), ...
              observer(2)+0.88*sin((thetaOcc+thetaSensor)/2)+0.04, ...
              '\\theta_{sensor,b}','Color',cSensor, ...
              'FontWeight','bold','FontSize',10);
          text(ax,observer(1)+1.20*cos(thetaBody/2), ...
              observer(2)+1.20*sin(thetaBody/2)+0.04, ...
              '\\theta_b','Color',cAccept,'FontWeight','bold','FontSize',10);

          text(ax,-2.42,-1.17, ...
              '\\theta_{keepout,b} = \\theta_{min,b} = max(\\theta_{occ,b}, \\theta_{sensor,b})', ...
              'Color',cKeepout,'FontWeight','bold','FontSize',9.4);
          text(ax,-2.42,-1.52, ...
              'Visible when \\theta_b > \\theta_{occ,b} and \\theta_b \\geq \\theta_{sensor,b}', ...
              'Color',cAccept,'FontWeight','bold','FontSize',9.2);
          text(ax,-2.42,-1.82, ...
              '\\theta_{sensor}: Earth 15^o, Moon 10^o, Sun 20^o', ...
              'FontWeight','bold','FontSize',9.0);

          title(ax,'(b) Unified angular keepout','FontSize',12,'FontWeight','bold');
          xlim(ax,[-2.75,2.85]);
          ylim(ax,[-2.05,2.05]);

          figureFile = fullfile(outputDir,'visibility_keepout_geometry.eps');
          inspect_before_export(fig,inspectFigure,'unified visibility / keepout geometry');
          export_publication_eps(fig,figureFile);
          close(fig);

          outputs = struct();
          outputs.figure = string(figureFile);
          outputs.thetaSensor_deg = struct('earth',15,'moon',10,'sun',20);
          fprintf('Saved visibility / keepout geometry to:\n  %s\n',figureFile);
          end


          function outputs = create_measurement_model_figure(inspectFigure)
          % Illustrate the implemented relative LOS angles-only measurement:
          % rho = r_target-r_observer, alpha = atan2(rho_y,rho_x), and
          % delta = asin(rho_z/|rho|). Visibility screening is applied before
          % this measurement is formed.

          if nargin<1 || isempty(inspectFigure), inspectFigure = true; end

          projectDir = fileparts(fileparts(mfilename('fullpath')));
          addpath(projectDir);
          projectPaths = setup_project();

          outputDir = fullfile(projectPaths.results,'study_definition_figures');
          if ~isfolder(outputDir), mkdir(outputDir); end

          fig = publication_figure(6.5,5.1);
          ax = axes(fig);
          hold(ax,'on');
          axis(ax,'equal');
          axis(ax,'vis3d');
          axis(ax,'off');
          view(ax,-37,24);

          cObserver = [0.90,0.12,0.10];
          cTarget = [0.00,0.39,0.72];
          cProjection = [0.35,0.35,0.35];
          cPlane = [0.88,0.94,0.98];
          cAngle = [0.88,0.43,0.08];
          cKeepout = [0.72,0.13,0.12];

          observer = [0,0,0];
          target = [2.75,2.00,1.70];
          projection = [target(1),target(2),0];
          rho = target-observer;
          rhoXY = norm(rho(1:2));
          alpha = atan2(rho(2),rho(1));
          delta = asin(rho(3)/norm(rho));

          planeX = [-2.0,3.5];
          planeY = [-1.8,3.0];
          [planeXX,planeYY] = meshgrid(planeX,planeY);
          planeZZ = zeros(size(planeXX));
          surf(ax,planeXX,planeYY,planeZZ, ...
              'FaceColor',cPlane,'EdgeColor',[0.70,0.78,0.82], ...
              'LineWidth',0.7);

          quiver3(ax,0,0,0,3.55,0,0,0,'Color','k','LineWidth',1.7, ...
              'MaxHeadSize',0.10);
          quiver3(ax,0,0,0,0,3.25,0,0,'Color','k','LineWidth',1.7, ...
              'MaxHeadSize',0.10);
          quiver3(ax,0,0,0,0,0,3.00,0,'Color','k','LineWidth',1.7, ...
              'MaxHeadSize',0.10);

          hProjection = quiver3(ax,0,0,0,projection(1),projection(2),0,0, ...
              'Color',cProjection,'LineStyle','--','LineWidth',1.4, ...
              'MaxHeadSize',0.10);
          hLos = quiver3(ax,0,0,0,rho(1),rho(2),rho(3),0, ...
              'Color','k','LineWidth',2.2,'MaxHeadSize',0.10);
          plot3(ax,[projection(1),target(1)], ...
              [projection(2),target(2)],[0,target(3)],'--', ...
              'Color',cProjection,'LineWidth',1.1);

          hObserver = plot3(ax,observer(1),observer(2),observer(3),'o', ...
              'MarkerSize',11,'MarkerFaceColor',cObserver,'MarkerEdgeColor','k', ...
              'LineWidth',1.0);
          hTarget = plot3(ax,target(1),target(2),target(3),'o', ...
              'MarkerSize',11,'MarkerFaceColor',cTarget,'MarkerEdgeColor','k', ...
              'LineWidth',1.0);
          plot3(ax,projection(1),projection(2),projection(3),'o', ...
              'MarkerSize',5,'MarkerFaceColor','w','MarkerEdgeColor',cProjection, ...
              'LineWidth',1.0);

          alphaSamples = linspace(0,alpha,100);
          alphaRadius = 1.08;
          plot3(ax,alphaRadius*cos(alphaSamples), ...
              alphaRadius*sin(alphaSamples),zeros(size(alphaSamples)), ...
              '-','Color',cAngle,'LineWidth',1.8);

          uXY = rho(1:2)/rhoXY;
          deltaSamples = linspace(0,delta,100);
          deltaRadius = 1.22;
          deltaArc = [ ...
              deltaRadius*cos(deltaSamples(:))*uXY(1), ...
              deltaRadius*cos(deltaSamples(:))*uXY(2), ...
              deltaRadius*sin(deltaSamples(:))];
          plot3(ax,deltaArc(:,1),deltaArc(:,2),deltaArc(:,3), ...
              '-','Color',cAngle,'LineWidth',1.8);

          alphaMid = alpha/2;
          text(ax,1.22*cos(alphaMid),1.22*sin(alphaMid),0.05,'\\alpha', ...
              'Color',cAngle,'FontWeight','bold','FontSize',14);
          deltaMid = delta/2;
          deltaLabel = [ ...
              1.42*cos(deltaMid)*uXY(1), ...
              1.42*cos(deltaMid)*uXY(2), ...
              1.42*sin(deltaMid)];
          text(ax,deltaLabel(1),deltaLabel(2),deltaLabel(3),'\\delta', ...
              'Color',cAngle,'FontWeight','bold','FontSize',14);

          text(ax,3.72,0,0,'x','FontWeight','bold','FontSize',13);
          text(ax,0,3.42,0,'y','FontWeight','bold','FontSize',13);
          text(ax,0,0,3.18,'z','FontWeight','bold','FontSize',13);
          text(ax,-1.70,-1.48,0.03,'x-y plane','FontWeight','bold','FontSize',11);
          text(ax,-0.25,-0.18,0.35,'Observer', ...
              'Color',cObserver,'FontWeight','bold','FontSize',11, ...
              'HorizontalAlignment','right');
          text(ax,target(1)+0.15,target(2)+0.10,target(3)+0.15,'Target', ...
              'Color',cTarget,'FontWeight','bold','FontSize',11);
          text(ax,1.45,1.12,1.02,'\\boldmath$\\rho$','Interpreter','latex', ...
              'FontWeight','bold','FontSize',12);
          text(ax,1.23,0.94,0.04,'\\rho_{xy}', ...
              'Color',cProjection,'FontWeight','bold','FontSize',10);

          formulaText = { ...
              '\\rho = r_{tar}-r_{obs}', ...
              '\\alpha = atan2(\\rho_y,\\rho_x)', ...
              '\\delta = asin(\\rho_z/||\\rho||)'};
          text(ax,-1.90,2.75,2.55,formulaText, ...
              'FontWeight','bold','FontSize',10.5, ...
              'BackgroundColor','w','EdgeColor',[0.72,0.72,0.72], ...
              'Margin',5);

          keepoutText = { ...
              'Visibility gate before measurement:', ...
              '\\theta_{keepout,b}=max(\\theta_{occ,b},\\theta_{sensor,b})'};
          text(ax,-1.90,-1.62,2.48,keepoutText, ...
              'Color',cKeepout,'FontWeight','bold','FontSize',9.5, ...
              'BackgroundColor','w','EdgeColor',[0.78,0.78,0.78], ...
              'Margin',5);

          title(ax,'Angles-only relative line-of-sight measurement', ...
              'FontSize',13,'FontWeight','bold');
          xlim(ax,[-2.1,4.0]);
          ylim(ax,[-1.9,3.4]);
          zlim(ax,[-0.1,3.2]);
          set(ax,'FontName','Times New Roman','FontSize',12,'FontWeight','bold');

          legendHandle = legend(ax,[hObserver,hTarget,hLos,hProjection], ...
              {'Observer','Target','LOS, \\rho','x-y projection'}, ...
              'Location','northoutside','Orientation','horizontal', ...
              'FontName','Times New Roman','FontSize',10,'FontWeight','bold');
          legendHandle.Box = 'on';
          legendHandle.NumColumns = 4;
          place_legend_above(legendHandle,4,10);
          ax.Position = [0.08,0.08,0.84,0.76];

          figureFile = fullfile(outputDir,'measurement_model_radec_geometry.eps');
          inspect_before_export(fig,inspectFigure,'RA/Dec measurement geometry');
          export_publication_eps(fig,figureFile);
          close(fig);

          outputs = struct();
          outputs.figure = string(figureFile);
          outputs.measurementType = "ANGLES_ONLY";
          fprintf('Saved RA/Dec measurement geometry to:\n  %s\n',figureFile);
          end


          function draw_angle_arc_2d(ax,origin,startAngle,endAngle,radius,color,lineWidth)
          angle = linspace(startAngle,endAngle,100);
          plot(ax,origin(1)+radius*cos(angle),origin(2)+radius*sin(angle), ...
              '-','Color',color,'LineWidth',lineWidth);
          end


          '''.replace('          ', '')

          text = text.replace(insert_marker, new_functions + insert_marker, 1)

          checks = [
              'numPairOrbitsPerFamily = 16;',
              'numDroOrbits = 16;',
              'function outputs = create_visibility_keepout_figure',
              'function outputs = create_measurement_model_figure',
              'theta_{keepout,b}',
              "visibility_keepout_geometry.eps",
              "measurement_model_radec_geometry.eps",
              'outputs.visibilityGeometry',
              'outputs.measurementGeometry',
          ]
          for check in checks:
              if check not in text:
                  raise SystemExit(f'Missing expected patched content: {check}')

          if 'plotStride = numel(familyRows)/perFamily;' in text:
              raise SystemExit('Obsolete integer-stride paired-family plotting remains.')
          if 'plotStride = numel(familyRows)/numDroOrbits;' in text:
              raise SystemExit('Obsolete integer-stride DRO plotting remains.')

          path.write_text(text)
          PY
      - name: Commit figure update
        shell: bash
        run: |
          rm .github/workflows/one-time-study-geometry-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add visibility and measurement schematics"
          git push origin main
