name: Fix orbit family shared legend

on:
  push:
    paths:
      - .github/workflows/fix-definition-family-legend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply orbit-family legend patch
        run: python .github/scripts/fix_definition_family_shared_legend.py
      - name: Static checks
        run: |
          git diff --check
          grep -q 'orbit_catalog_family_legend.eps' scripts/plot_study_definition_figures.m
          grep -q 'outputs.sharedLegend' scripts/plot_study_definition_figures.m
          grep -q 'The four paired orbit-family panels share one legend-only EPS' scripts/plot_study_definition_figures.m
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/plot_study_definition_figures.m
          git commit -m "Separate orbit family shared legend"
          git push origin main
