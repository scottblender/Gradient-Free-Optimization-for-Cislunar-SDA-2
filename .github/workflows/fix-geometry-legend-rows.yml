name: Fix shared trajectory legend rows

on:
  push:
    paths:
      - .github/workflows/fix-geometry-legend-rows.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply legend layout patch
        run: python .github/scripts/fix_geometry_legend_rows.py
      - name: Static checks
        run: |
          git diff --check
          grep -q 'style.sharedGeometryLegendHeight = 1.55' scripts/reviewer2_paper_style.m
          grep -q 'lgd.NumColumns = 3; % 8 entries -> 3 rows' scripts/plot_reviewer2_geometry_grid.m
          grep -q 'lgd.NumColumns = 2; % 6 entries -> 3 rows' scripts/plot_reviewer2_geometry_grid.m
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reviewer2_paper_style.m scripts/plot_reviewer2_geometry_grid.m tests/test_reviewer2_paper_figures_configuration.m
          git commit -m "Allow three-row shared trajectory legends"
          git push origin main
