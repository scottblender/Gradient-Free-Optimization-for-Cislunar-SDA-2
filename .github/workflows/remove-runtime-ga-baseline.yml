name: Remove GA baseline from 1200-FE objective plot
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-runtime-ga-baseline.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update runtime objective plot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/make_reviewer2_curated_figures.m')
          text = path.read_text(encoding='utf-8')
          old = '''    baseline = matched_baseline(baselineResults,"LUNAR_GATEWAY",3,1);\n\n    plot_runtime_metric(r,'BestJMean','BestJStd','Mean final best objective', ...\n        "runtime_1200_objective",out,saveFigures,style,false,baseline);\n    manifest = add_manifest(manifest,"runtime","runtime_1200_objective", ...\n        "Equal-1200-FE mean final-best objective with matched GA baseline.");'''
          new = '''    plot_runtime_metric(r,'BestJMean','BestJStd','Mean final best objective', ...\n        "runtime_1200_objective",out,saveFigures,style,false,table());\n    manifest = add_manifest(manifest,"runtime","runtime_1200_objective", ...\n        "Equal-1200-FE mean final-best objective comparison.");'''
          if old not in text:
              raise SystemExit('Expected runtime objective baseline block was not found.')
          text = text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          git diff --check
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-runtime-ga-baseline.yml
          git add scripts/make_reviewer2_curated_figures.m
          git commit -m "Remove GA baseline from 1200-FE objective plot"
          git push origin HEAD:main
