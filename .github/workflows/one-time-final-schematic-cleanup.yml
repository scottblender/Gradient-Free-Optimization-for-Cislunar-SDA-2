name: One-time final schematic cleanup

on:
  push:
    paths:
      - 'scripts/_patch_final_schematic_cleanup.py'
      - '.github/workflows/one-time-final-schematic-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch final schematics
        run: python scripts/_patch_final_schematic_cleanup.py
      - name: Commit final schematic cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/_patch_final_schematic_cleanup.py
          rm .github/workflows/one-time-final-schematic-cleanup.yml
          git add scripts/plot_study_definition_figures.m scripts/_patch_final_schematic_cleanup.py .github/workflows/one-time-final-schematic-cleanup.yml
          git commit -m "Finalize visibility and measurement schematics"
          for i in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
