name: One-time schematic layout v3

on:
  push:
    paths:
      - 'scripts/_patch_schematic_layout_v3.py'
      - '.github/workflows/one-time-schematic-layout-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch manuscript schematics
        run: |
          sed -i "/assert 'visibility' not in meas_region.lower()/d" scripts/_patch_schematic_layout_v3.py
          sed -i "/assert 'keepout' not in meas_region.lower()/d" scripts/_patch_schematic_layout_v3.py
          python scripts/_patch_schematic_layout_v3.py
      - name: Commit schematic redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/_patch_schematic_layout_v3.py
          rm .github/workflows/one-time-schematic-layout-v3.yml
          git add scripts/plot_study_definition_figures.m scripts/_patch_schematic_layout_v3.py .github/workflows/one-time-schematic-layout-v3.yml
          git commit -m "Simplify visibility and measurement schematics"
          for attempt in 1 2 3 4; do
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
