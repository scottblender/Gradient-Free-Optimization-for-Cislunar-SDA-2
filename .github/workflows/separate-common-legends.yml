name: Separate common result legends

on:
  push:
    paths:
      - .github/workflows/separate-common-legends.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix common-legend syntax
        run: python .github/scripts/fix_common_legend_syntax.py
      - name: Static checks
        run: |
          git diff --check
          ! grep -q 'observerSpecs = { ...$' <(sed -n '115,135p' scripts/make_reviewer2_curated_figures.m)
          grep -q 'baseline_observer_metric_legend' scripts/make_reviewer2_curated_figures.m
          grep -q 'parallel_speed_lg_legend' scripts/plot_parallel_speed.m
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/make_reviewer2_curated_figures.m scripts/plot_parallel_speed.m
          git commit -m "Fix shared legend layout syntax"
          git push origin main
