name: Separate common result legends

on:
  push:
    paths:
      - .github/workflows/separate-common-legends.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Finalize common-legend implementation retry
        run: python .github/scripts/finalize_common_legend_patch.py
      - name: Static checks
        run: |
          git diff --check
          grep -q 'comparison_orbit_family_selection_legend' scripts/make_reviewer2_curated_figures.m
          grep -q 'baseline_orbit_family_selection_legend' scripts/make_reviewer2_curated_figures.m
          grep -q 'runtime_1200_legend' scripts/make_reviewer2_curated_figures.m
          grep -q 'files=strings(3,1)' scripts/plot_parallel_speed.m
          grep -q 'files(3)=legendFiles(1)' scripts/plot_parallel_speed.m
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/make_reviewer2_curated_figures.m scripts/make_reviewer2_runtime_figures.m scripts/plot_parallel_speed.m
          git commit -m "Finalize shared result legend exports"
          git push origin main
